# First step of pull request CI: bring the checkout up to date with the base
# before tests. Copy into .github/workflows/ of the consuming repo.
# This file is not active in the Truce repo.
#
# Required repository secret: OPENROUTER_API_KEY
#
# push is false, so the sync commit stays in this job. The tests below see
# it. The PR branch is not updated, and this workflow does not run again
# because of a sync push. Set push: true and permissions.contents: write
# only when the branch itself must move; that push starts another
# pull_request run.
#
# Do not actions/checkout again before the tests. The composite action
# already checked the repo out, and a second checkout would drop the sync.

name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Sync with base
        uses: AJFrio/Truce@v1
        with:
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          mode: sync
          push: false
          # target-branch: main
          # verify-cmd: cargo test

      - name: Tests
        run: cargo test
