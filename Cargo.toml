[package]
name = "truce"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Resolve git merge conflicts using fast decision models"
repository = "https://github.com/AJFrio/Truce"
readme = "README.md"
keywords = ["git", "merge", "conflicts", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.93"
clap = { version = "=4.5.23", features = ["derive"] }
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
thiserror = "2.0.3"

[dev-dependencies]
assert_cmd = "~2.0.16"
predicates = "~3.1.2"
tempfile = "~3.14.0"

[profile.release]
lto = false
codegen-units = 16
